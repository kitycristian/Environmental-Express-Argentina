<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor de Informe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #525659;
      font-family: system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #525659;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #ccc;
      font-size: 14px;
      z-index: 100;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #pages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #pages canvas {
      display: block;
      max-width: 100%;
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
      background: white;
    }
    #error {
      display: none;
      color: #ff6b6b;
      padding: 20px;
      text-align: center;
      font-size: 14px;
    }
    @media print {
      body { background: white; }
      #pages { padding: 0; overflow: visible; height: auto; }
      #pages canvas { box-shadow: none; page-break-after: always; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span>Cargando informe…</span>
  </div>
  <div id="error">No se pudo cargar el informe. Por favor cerrá y volvé a intentar.</div>
  <div id="pages"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const params = new URLSearchParams(window.location.search);
    const src = params.get("src");

    if (!src) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "block";
    } else {
      pdfjsLib.getDocument(src).promise.then(function(pdf) {
        document.getElementById("loading").style.display = "none";
        const container = document.getElementById("pages");
        const scale = window.devicePixelRatio >= 2 ? 2.5 : 2;
        const renders = [];
        for (let i = 1; i <= pdf.numPages; i++) {
          renders.push(
            pdf.getPage(i).then(function(page) {
              const viewport = page.getViewport({ scale });
              const canvas = document.createElement("canvas");
              const ctx = canvas.getContext("2d");
              canvas.height = viewport.height;
              canvas.width = viewport.width;
              canvas.style.width = Math.floor(viewport.width / scale) + "px";
              canvas.style.height = Math.floor(viewport.height / scale) + "px";
              canvas.dataset.page = page.pageNumber;
              return page.render({ canvasContext: ctx, viewport }).promise.then(function() {
                return canvas;
              });
            })
          );
        }
        // Insertar páginas en orden
        Promise.all(renders).then(function(canvases) {
          canvases.forEach(function(c) { container.appendChild(c); });
        });
      }).catch(function(err) {
        console.error("PDF load error:", err);
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
      });
    }

    // Escuchar print desde el padre
    window.addEventListener("message", function(e) {
      if (e.data === "print") window.print();
    });
  </script>
</body>
</html>
